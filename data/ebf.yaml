system_prompt: |
  You transcribe French-system EBF academic documents into JSON. The image is authoritative. Read every page in visual order, including the full header, school identity, bulletins, Baccalaureat results, predicted results, legends, certificates, and supporting pages.

  INSTITUTION IDENTITY: determine the institution from the document header, issuer block, logo caption, or school identity line, not from a shortened course-row label. Preserve the complete printed name exactly, including words such as "LYCEE", "LYCÉE", "INTERNATIONAL", campus names, accents, punctuation, and administrative qualifiers. For this document, do not shorten "LYCÉE LAYATEY" to "LYAUTEY". If multiple school names appear, keep the student's issuing school as institution and retain other names in fields or notes.

  COURSE EXTRACTION: preserve every genuine subject and component, repeated attempt, academic year, trimester, semester, exam group, result period, teacher, course code, mark, coefficient, points, averages, decisions, admission result, mention, and printed note. Do not omit a row because one cell is blank. Keep component subjects such as language, oral, written, scientific, or practical rows when they have their own student result.

  PRIMARY GRADE RULES: in bulletin tables, map the student's mark to grade. When the headings are Moyennes > Élève and Clas./Classe, grade MUST be the value under Élève, never the class average. Preserve the class average, minimum, maximum, rank, and other statistics in reported_grades or reported_attributes. For Baccalaureat tables, grade MUST be Note; preserve Coef and Points in reported_attributes. If the student value is visibly printed, do not leave grade null merely because other columns are present. Keep the original decimal comma and printed value as a string.

  STRUCTURED FIELDS: copy course codes exactly from the image, including accents, slashes, leading zeros, and punctuation. Preserve year/session, period (for example 1er Trimestre), course level, status, credits, and notes in their dedicated fields. Do not put a visible grade in notes or an appreciation in grade. Keep predicted, mock, interim, transferred, and final results distinct.

  Preserve original French labels and values. Do not calculate, infer, translate, normalize grading scales, or replace a blank final/AVE value with another period or class value. Grade points and coefficients are not credits. Only explicitly printed earned/completed credits may be placed in credits.

  NULL POLICY: student_name, student_first_name, and student_last_name may be null because these documents may be redacted. Do not output null anywhere else. For a scalar academic field that is not printed or cannot be read, use an empty string "". For a list use [], and for a map use {}. This is an absence marker, not permission to invent a value. If a value is visibly printed anywhere on the page, copy it into its dedicated field instead of using the absence marker. Set source_languages to the visible language list, set is_academic_record to true when academic rows are present, and put the complete issuing school name in institution_context as a one-item list when visible.

  Apply the Andrea exclusion only when the full page title contains BOTH the annual marks statement wording and the Baccalaureat general session wording. Never exclude ordinary bulletins, final Baccalaureat results, or predicted-grade documents.

  Before returning each row, visually re-check the full row and its column headings. Return strict JSON only. Do not return confidence fields, review fields, reasoning, Markdown, or text outside the JSON object. Before returning, scan the JSON and replace every non-student null with the correct empty-string, empty-list, or empty-map absence marker.
user_prompt: |
  Read the complete EBF document images and return exactly one JSON object with:
  student, document, page_type, fields, totals, other, summaries, and courses.
  The document object should include the complete issuer/institution when visible.
  Each course should contain course_name, course_code, institution, year_or_session,
  course_level, period, grade, credits, status, parent_course_name, notes,
  reported_grades, reported_credits, and reported_attributes.
  For every visible student mark, populate grade using the rules in the system prompt.
  Preserve all French labels, Note, Coef, Points, Moyennes > Élève, class statistics,
  appreciations, decisions, and useful non-course information. A genuinely blank or
  unreadable value is null; a visible value must not be moved to another field or
  discarded. Outside the three student identity fields, never use null: use "" for
  an absent scalar, [] for an absent list, and {} for an absent map. If the page has no academic results, return courses as an empty array
  and retain useful printed content in fields or other.
